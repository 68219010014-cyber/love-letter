<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>จดหมายถึงเธอ ❤️</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="container">
    <h1>ถึง... คนที่ฉันรักที่สุดในโลก 🌍</h1>
    <div id="heart-container"></div>
    <p id="message">ฉันอยากบอกเธอว่า...</p>
    <button id="revealBtn">กดที่นี่เพื่ออ่าน 💌</button>
    <div id="loveText" class="hidden">
      <p>เธอทำให้ทุกวันของฉันมีความหมาย<br>
         รอยยิ้มของเธอคือแสงอาทิตย์ของฉัน<br>
         แค่ได้อยู่ข้างๆ เธอ ก็คือความสุขที่สุดแล้ว 💖</p>
      <p>— จาก หัวใจของฉัน <br> วันที่ 15 ธันวาคม 2025</p>
      <button id="moreBtn">✨ กดเพื่อดูหัวใจพิเศษ</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
