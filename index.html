<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>จดหมายถึงอ้วนสุดที่รัก ❤️</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="container">
    <h1>ถึงอ้วนกิ่ง คนที่เค้ารักที่สุดในโลก 🌍</h1>
    <div id="heart-container"></div>
    <p id="message">ฉันอยากบอกเธอว่า...</p>
    <button id="revealBtn">กดที่นี่เพื่ออ่าน 💌</button>
    <div id="loveText" class="hidden">
      <p>อ้วนทำให้ทุกวันของเค้ามีความหมาย<br>
         รอยยิ้มของอ้วนและเสียงหัวเราะคือสิ่งที่สดใสที่สุดของเค้า<br>
         แค่ได้อยู่ข้างๆ อ้วนกิ่ง ก็คือความสุขที่สุดแล้ว 💖</p>
      <p>— จาก หัวใจของฉัน <br> วันที่ 12 ธันวาคม 2025</p>
      <button id="moreBtn">✨ กดเพื่อดูหัวใจพิเศษ</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>

</html>
